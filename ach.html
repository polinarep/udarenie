<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Достижения — тренажёры по русскому языку</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231B2A55'/%3E%3Ctext x='32' y='51' text-anchor='middle' font-family='Georgia,Times New Roman,serif' font-size='42' font-weight='700' fill='%23FAFBFD'%3E%D0%90%3C/text%3E%3Crect x='34' y='3' width='5.5' height='15' rx='2' fill='%23FF5A6E' transform='rotate%2838 36.7 10.5%29'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFBFD; --grid:#E6ECF6; --ink:#1B2A55; --muted:#5E6A8A; --red:#C8243A;
  --line:#C9D4E6; --soft:#EEF2F9; --gold:#B8860B;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10151F; --grid:#18202E; --ink:#E4E9F6; --muted:#97A2BE; --red:#FF6E7F;
    --line:#2C3850; --soft:#182131; --gold:#E7B94A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10151F; --grid:#18202E; --ink:#E4E9F6; --muted:#97A2BE; --red:#FF6E7F;
  --line:#2C3850; --soft:#182131; --gold:#E7B94A; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;min-height:100%;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;color:var(--ink);
  font:16px/1.5 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
.wrap{max-width:660px;margin:0 auto;padding:28px 18px 48px}
h1{font-family:Literata,Georgia,serif;font-weight:600;font-size:clamp(2rem,8vw,2.9rem);line-height:1.1;margin:0 0 10px}
.lead{color:var(--muted);margin:0 0 20px;max-width:34em}
.jump{display:inline-block;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;background:var(--paper);font-size:.95rem}
.jump b{font-weight:600}
h2{font-family:Literata,Georgia,serif;font-weight:600;font-size:1.25rem;margin:30px 0 10px;color:var(--muted)}
a.card{
  display:grid;grid-template-columns:auto 1fr;gap:4px 18px;align-items:start;
  text-decoration:none;color:var(--ink);background:var(--paper);
  border:1px solid var(--line);border-left:4px solid var(--red);border-radius:6px 12px 12px 6px;
  padding:16px 18px;margin:0 0 12px
}
a.card:hover{border-color:var(--ink);border-left-color:var(--red)}
a:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.num{grid-row:span 3;font-family:Literata,Georgia,serif;font-weight:600;font-size:2.6rem;line-height:1;color:var(--red);min-width:1.4em;text-align:center}
.num small{display:block;font-family:"Golos Text",system-ui,sans-serif;font-size:.7rem;font-weight:500;color:var(--muted);margin-top:4px}
.title{font-weight:600;font-size:1.1rem}
.desc{color:var(--muted);font-size:.93rem}
.prog{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted);margin-top:6px}
.bar{flex:1;height:5px;background:var(--soft);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:var(--red)}
#ach{margin-top:44px;padding-top:6px;border-top:2px solid var(--line)}
#ach h2.top{font-size:1.6rem;color:var(--ink);margin:18px 0 4px}
.achsum{color:var(--muted);margin:0 0 4px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:12px;padding:14px 12px;background:var(--paper);text-align:center}
.badge .e{font-size:2.2rem;line-height:1.1;display:block;margin-bottom:6px}
.badge .t{font-weight:600;font-size:.95rem;line-height:1.3}
.badge .d{color:var(--muted);font-size:.82rem;margin-top:4px;line-height:1.35}
.badge.got{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.badge.got .when{color:var(--gold);font-size:.78rem;margin-top:6px}
.badge.lock .e{filter:grayscale(1);opacity:.35}
.badge.lock .t{color:var(--muted)}
.about{display:flex;gap:18px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:0 0 22px}
.about img{width:96px;height:96px;border-radius:50%;object-fit:cover;flex:none;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--red)}
.about h2{margin:0 0 4px;color:var(--ink);font-size:1.15rem}
.about p{margin:0 0 10px;font-size:.95rem}
.tg{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;font-size:.92rem;color:var(--paper);background:var(--ink);border-radius:999px;padding:7px 14px}
.tg:hover{background:var(--red)}
@media (max-width:420px){.about{flex-direction:column;text-align:center}}
.credit{margin-top:36px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem;text-align:center}
.credit a{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1px solid var(--line)}
.credit a:hover{border-bottom-color:var(--red)}
.logo{position:relative;display:inline-grid;place-items:center;width:58px;height:58px;border-radius:15px;background:var(--ink);color:var(--paper);font-family:Literata,Georgia,serif;font-weight:600;font-size:36px;line-height:1;padding-top:6px;flex:none;text-decoration:none}
.logo::after{content:"";position:absolute;left:54%;top:5px;width:5px;height:15px;border-radius:2px;background:var(--red);transform:rotate(38deg) scaleY(1);transform-origin:50% 100%}
.logo.sm{width:26px;height:26px;border-radius:7px;font-size:16px;padding-top:3px}
.logo.sm::after{top:2px;width:2.5px;height:7px;border-radius:1px}
.logo.anim::after{transform:rotate(38deg) scaleY(0);animation:logoPen .35s ease-out .25s forwards}
@keyframes logoPen{to{transform:rotate(38deg) scaleY(1)}}
@media (prefers-reduced-motion:reduce){.logo.anim::after{animation:none;transform:rotate(38deg) scaleY(1)}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:5px;margin:4px 0 6px}
.seg button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 8px;background:none;color:var(--muted);font-weight:600;font-size:1.15rem;line-height:1.2}
.seg button small{display:block;font-weight:400;font-size:.8rem}
.seg button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(27,42,85,.15)}
.seg button[aria-selected="true"] small{color:var(--muted)}
.seg button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.examlead{color:var(--muted);font-size:.93rem;margin:10px 0 0}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);text-decoration:none;font-size:.92rem;padding:4px 0}
.back:hover{color:var(--ink)}
.foot{margin-top:34px;color:var(--muted);font-size:.88rem}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="./"><span class="logo sm" aria-hidden="true">А</span>Все тренажёры</a>
  <h1 style="margin-top:12px">Достижения</h1>
  <p class="achsum"><a href="stats.html" style="color:var(--ink)">📊 Посмотреть статистику</a></p>
  <p class="achsum" id="achSum"></p>
  <div id="achList"></div>
  <p class="credit">Автор тренажёров — <a href="https://t.me/clwyxi" target="_blank" rel="noopener">@clwyxi</a> в Telegram</p>
</div>
<script>
/* ===== Достижения (общий модуль для всех страниц) ===== */
const ACH=(()=>{
  const K='ege-ach-v1';
  const L=[
    {id:'a4_1',g:'ЕГЭ · задание 4',e:'🎯',t:'Первый удар',d:'Дать первый верный ответ в тренажёре ударений',f:(s,c)=>(c.ok4||0)>=1},
    {id:'a4_10',g:'ЕГЭ · задание 4',e:'🎂',t:'Не тортЫ, а тОрты',d:'Выучить 10 слов',f:s=>s.s4>=10},
    {id:'a4_50',g:'ЕГЭ · задание 4',e:'🛠️',t:'Ударник орфоэпического труда',d:'Выучить 50 слов',f:s=>s.s4>=50},
    {id:'a4_100',g:'ЕГЭ · задание 4',e:'🥊',t:'Сто ударов — ни одного синяка',d:'Выучить 100 слов',f:s=>s.s4>=100},
    {id:'a4_all',g:'ЕГЭ · задание 4',e:'📖',t:'Ходячий словник',d:'Выучить все 219 слов',f:s=>s.s4>=219},
    {id:'a4_st',g:'ЕГЭ · задание 4',e:'📞',t:'ЗвонИт, а не звОнит',d:'20 верных ответов подряд',f:(s,c)=>(c.best4||0)>=20},
    {id:'a4_ex',g:'ЕГЭ · задание 4',e:'🍀',t:'Четвёртый — не лишний',d:'Решить без ошибок 10 заданий «как на ЕГЭ»',f:(s,c)=>(c.ex4||0)>=10},
    {id:'a5_1',g:'ЕГЭ · задание 5',e:'🧥',t:'Надел, а не одел',d:'Дать первый верный ответ в тренажёре паронимов',f:(s,c)=>(c.ok5||0)>=1},
    {id:'a5_25',g:'ЕГЭ · задание 5',e:'🎩',t:'Дипломат, а не дипломант',d:'Освоить 25 словосочетаний',f:s=>s.s5>=25},
    {id:'a5_100',g:'ЕГЭ · задание 5',e:'📵',t:'Абонент вне зоны ошибок',d:'Освоить 100 словосочетаний',f:s=>s.s5>=100},
    {id:'a5_all',g:'ЕГЭ · задание 5',e:'💥',t:'Эффектно и эффективно',d:'Освоить все словосочетания',f:s=>s.s5>=s.t5&&s.t5>0},
    {id:'a5_st',g:'ЕГЭ · задание 5',e:'😇',t:'Ни одного проступка',d:'15 верных ответов подряд',f:(s,c)=>(c.best5||0)>=15},
    {id:'a5_ex',g:'ЕГЭ · задание 5',e:'✍️',t:'Исправитель паронимов',d:'Решить верно 10 заданий «как на ЕГЭ»',f:(s,c)=>(c.ex5||0)>=10},
    {id:'a9_1',g:'ЕГЭ · задание 9',e:'🔤',t:'Буква в яблочко',d:'Дать первый верный ответ в тренажёре корней',f:(s,c)=>(c.ok9||0)>=1},
    {id:'a9_25',g:'ЕГЭ · задание 9',e:'☀️',t:'ЗагОрел, но не сгорел',d:'Освоить 25 слов',f:s=>s.s9>=25},
    {id:'a9_100',g:'ЕГЭ · задание 9',e:'🌱',t:'Растение без ростка сомнений',d:'Освоить 100 слов',f:s=>s.s9>=100},
    {id:'a9_all',g:'ЕГЭ · задание 9',e:'🌳',t:'Корень зла найден',d:'Освоить все слова тренажёра',f:s=>s.s9>=s.t9&&s.t9>0},
    {id:'a9_st',g:'ЕГЭ · задание 9',e:'🦘',t:'Скачок без ошибок',d:'15 верных ответов подряд',f:(s,c)=>(c.best9||0)>=15},
    {id:'a9_ex',g:'ЕГЭ · задание 9',e:'🎯',t:'Одна и та же буква',d:'Решить верно 10 заданий «как на ЕГЭ»',f:(s,c)=>(c.ex9||0)>=10},
    {id:'a22_1',g:'ЕГЭ · задание 22',e:'🌟',t:'Первая метафора',d:'Дать первый верный ответ в тренажёре выразительности',f:(s,c)=>(c.ok22||0)>=1},
    {id:'a22_10',g:'ЕГЭ · задание 22',e:'🥾',t:'Тропинка',d:'Освоить 10 примеров',f:s=>s.s22>=10},
    {id:'a22_50',g:'ЕГЭ · задание 22',e:'🎭',t:'Мильон терзаний позади',d:'Освоить 50 примеров',f:s=>s.s22>=50},
    {id:'a22_all',g:'ЕГЭ · задание 22',e:'🪶',t:'Сам себе Пушкин',d:'Освоить все 108 примеров',f:s=>s.s22>=108},
    {id:'a22_st',g:'ЕГЭ · задание 22',e:'🔁',t:'Анафора! Анафора! Анафора!',d:'15 верных ответов подряд',f:(s,c)=>(c.best22||0)>=15},
    {id:'a22_ex',g:'ЕГЭ · задание 22',e:'✌️',t:'Два балла из двух',d:'Решить «как на ЕГЭ» без единой ошибки',f:(s,c)=>(c.ex22||0)>=1},
    {id:'o6_1',g:'ОГЭ · задание 6',e:'🔍',t:'Объяснительная записка',d:'Дать первый верный ответ в тренажёре задания 6',f:(s,c)=>(c.oko6||0)>=1},
    {id:'o6_50',g:'ОГЭ · задание 6',e:'⚖️',t:'Справедливый судья',d:'Освоить 50 утверждений',f:s=>s.so6>=50},
    {id:'o6_all',g:'ОГЭ · задание 6',e:'📚',t:'Ходячий справочник',d:'Освоить все утверждения',f:s=>s.so6>=s.to6&&s.to6>0},
    {id:'o6_st',g:'ОГЭ · задание 6',e:'🎬',t:'Не верю!',d:'15 верных ответов подряд',f:(s,c)=>(c.besto6||0)>=15},
    {id:'o6_ex',g:'ОГЭ · задание 6',e:'📝',t:'Верное объяснение',d:'Решить верно 10 заданий «как на ОГЭ»',f:(s,c)=>(c.exo6||0)>=10},
    {id:'o9_1',g:'ОГЭ · задание 9',e:'🐰',t:'Заячьи уши',d:'Сделать первое верное преобразование',f:(s,c)=>(c.oko9||0)>=1},
    {id:'o9_25',g:'ОГЭ · задание 9',e:'🔗',t:'Связной',d:'Освоить 25 словосочетаний',f:s=>s.so9>=25},
    {id:'o9_all',g:'ОГЭ · задание 9',e:'🪢',t:'Мастер связей',d:'Освоить все словосочетания',f:s=>s.so9>=s.to9&&s.to9>0},
    {id:'o9_st',g:'ОГЭ · задание 9',e:'⛓️',t:'Согласен, управляю, примыкаю',d:'15 верных ответов подряд',f:(s,c)=>(c.besto9||0)>=15},
    {id:'g_all',g:'Весь сайт',e:'🧰',t:'Многостаночник',d:'Освоить хотя бы по 10 в каждом тренажёре ЕГЭ',f:s=>s.s4>=10&&s.s5>=10&&s.s9>=10&&s.s22>=10},
    {id:'g_oge',g:'Весь сайт',e:'🎓',t:'Девятый вал',d:'Освоить хотя бы по 10 в каждом тренажёре ОГЭ',f:s=>s.so6>=10&&s.so9>=10},
    {id:'g_500',g:'Весь сайт',e:'🏃',t:'Марафонец',d:'Дать 500 ответов во всех тренажёрах',f:(s,c)=>(c.ans||0)>=500},
    {id:'g_night',g:'Весь сайт',e:'🦉',t:'Сова-филолог',d:'Позаниматься после 23:00',f:(s,c)=>!!c.night,hidden:true},
    {id:'g_morning',g:'Весь сайт',e:'🐦',t:'Ранняя пташка',d:'Позаниматься до 7 утра',f:(s,c)=>!!c.morning,hidden:true}
  ];
  function load(){try{const v=JSON.parse(localStorage.getItem(K));if(v&&v.u&&v.c)return v;}catch(e){}return {u:{},c:{}};}
  function store(st){try{localStorage.setItem(K,JSON.stringify(st));}catch(e){}}
  function cnt(key,need){try{const p=JSON.parse(localStorage.getItem(key)||'{}');return Object.values(p.w||{}).filter(x=>x.b>=need).length;}catch(e){return 0;}}
  function tot(key){try{return +(localStorage.getItem(key)||0);}catch(e){return 0;}}
  function stats(){
    return {s4:cnt('udarenie-ege-2026-v1',3),s22:cnt('vyrazitelnost-ege22-v1',2),
      s5:cnt('paronimy-ege5-v1',2),t5:tot('paronimy-ege5-total'),
      s9:cnt('korni-ege9-v1',2),t9:tot('korni-ege9-total'),
      so6:cnt('oge6-v1',2),to6:tot('oge6-total'),
      so9:cnt('oge9-v1',2),to9:tot('oge9-total')};
  }
  function check(st){const s=stats(),fresh=[];L.forEach(a=>{if(!st.u[a.id]&&a.f(s,st.c)){st.u[a.id]=Date.now();fresh.push(a);}});return fresh;}
  function toast(a){
    let w=document.getElementById('achToast');
    if(!w){w=document.createElement('div');w.id='achToast';w.setAttribute('aria-live','polite');document.body.appendChild(w);}
    const el=document.createElement('div');el.className='ach-t';
    el.innerHTML=`<span class="ach-e" aria-hidden="true">${a.e}</span><span><b>Достижение: ${a.t}</b><br><small>${a.d}</small></span>`;
    w.appendChild(el);
    setTimeout(()=>el.classList.add('out'),4200);setTimeout(()=>el.remove(),4700);
  }
  function event(ev){
    const st=load(),c=st.c,tr=ev.tr;
    if(typeof ev.ok==='boolean'){
      c.ans=(c.ans||0)+1;
      const d=new Date(),dk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      c.days=c.days||{};const dd=c.days[dk]||(c.days[dk]=[0,0,{}]);
      dd[0]++;if(ev.ok)dd[1]++;dd[2][tr]=(dd[2][tr]||0)+1;
      const ks=Object.keys(c.days).sort();while(ks.length>180)delete c.days[ks.shift()];
      if(ev.ok)c['ok'+tr]=(c['ok'+tr]||0)+1;
      if((ev.streak||0)>(c['best'+tr]||0))c['best'+tr]=ev.streak;
      const h=new Date().getHours();
      if(h>=23||h<4)c.night=1;
      if(h>=4&&h<7)c.morning=1;
    }
    if(ev.full)c['ex'+tr]=(c['ex'+tr]||0)+1;
    const fresh=check(st);store(st);
    fresh.forEach((a,i)=>setTimeout(()=>toast(a),i*2800));
  }
  function all(){const st=load();check(st);store(st);return L.map(a=>Object.assign({},a,{got:!!st.u[a.id],when:st.u[a.id]}));}
  function raw(){return load();}
  return {event,all,raw};
})();

const A=ACH.all();
const got=A.filter(a=>a.got).length;
document.getElementById('achSum').textContent=got?`Открыто ${got} из ${A.length}. Достижения хранятся в этом браузере.`:`Пока ничего не открыто. Начните любой тренажёр — первое достижение появится после первого верного ответа.`;
const groups=[...new Set(A.map(a=>a.g))];
const fmtDate=t=>new Date(t).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
document.getElementById('achList').innerHTML=groups.map(g=>{
  const items=A.filter(a=>a.g===g);const n=items.filter(a=>a.got).length;
  return `<h2>${g} <small style="font-family:'Golos Text',system-ui,sans-serif;font-size:.85rem;font-weight:400">${n} из ${items.length}</small></h2><div class="badges">`+items.map(a=>{
  if(a.got) return `<div class="badge got"><span class="e" aria-hidden="true">${a.e}</span><div class="t">${a.t}</div><div class="d">${a.d}</div><div class="when">получено ${fmtDate(a.when)}</div></div>`;
  if(a.hidden) return `<div class="badge lock"><span class="e" aria-hidden="true">❔</span><div class="t">Секретное достижение</div><div class="d">Условие откроется вместе с ним</div></div>`;
  return `<div class="badge lock"><span class="e" aria-hidden="true">${a.e}</span><div class="t">${a.t}</div><div class="d">${a.d}</div></div>`;
}).join('')+'</div>';}).join('');
</script>
</body>
</html>
